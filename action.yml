name: 'Causari Guard'
description: 'Privacy-preserving causal watchdog for AI-generated code'
author: 'Croviatrust'
branding:
  icon: shield
  color: purple

inputs:
  token:
    description: 'GitHub token for PR comments'
    required: false
    default: ''
  limit:
    description: 'Events to scan'
    required: false
    default: '20'
  fail-on-alert:
    description: 'Fail CI on alert'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Install Causari
      shell: bash
      run: |
        if command -v re &> /dev/null; then
          echo "re already installed"
          exit 0
        fi
        OS=$(uname -s)
        ARCH=$(uname -m)
        case "$OS" in
          Linux)   PLATFORM="unknown-linux-gnu" ;;
          Darwin)  PLATFORM="apple-darwin" ;;
          MINGW*|MSYS*|CYGWIN*) PLATFORM="pc-windows-msvc"; EXT=".exe" ;;
          *)       echo "Unsupported OS: $OS"; exit 1 ;;
        esac
        case "$ARCH" in
          x86_64)  TARGET="x86_64-${PLATFORM}" ;;
          aarch64) TARGET="aarch64-${PLATFORM}" ;;
          arm64)   TARGET="aarch64-${PLATFORM}" ;;
          *)       echo "Unsupported arch: $ARCH"; exit 1 ;;
        esac
        URL="https://github.com/croviatrust/causari/releases/latest/download/re-${TARGET}.tar.gz"
        echo "Downloading re for ${TARGET}..."
        curl -sSL "$URL" -o /tmp/re.tar.gz
        if [ -n "${EXT:-}" ]; then
          tar xzf /tmp/re.tar.gz -C /usr/bin
        else
          tar xzf /tmp/re.tar.gz -C /usr/local/bin --strip-components=0
          chmod +x /usr/local/bin/re
        fi
        echo "Installed re"
    - name: Run Guard
      shell: bash
      run: |
        set -euo pipefail
        re guard --summary -n "${{ inputs.limit }}" > "$RUNNER_TEMP/guard-summary.md"
        cat "$RUNNER_TEMP/guard-summary.md"

    - name: Post / update PR comment
      if: ${{ github.event.pull_request.number && inputs.token != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        PR: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        MARKER="<!-- causari-guard -->"
        {
          echo "$MARKER"
          cat "$RUNNER_TEMP/guard-summary.md"
        } > "$RUNNER_TEMP/comment.md"
        ID=$(gh api "repos/${REPO}/issues/${PR}/comments" \
               --jq "map(select(.body | contains(\"$MARKER\"))) | .[0].id // empty")
        if [ -n "$ID" ]; then
          gh api -X PATCH "repos/${REPO}/issues/comments/${ID}" \
            -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          echo "Updated existing guard comment ($ID)."
        else
          gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          echo "Posted new guard comment."
        fi

    - name: Enforce fail-on-alert
      if: ${{ inputs.fail-on-alert == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if grep -q '🔴' "$RUNNER_TEMP/guard-summary.md"; then
          COUNT=$(grep -c '🔴' "$RUNNER_TEMP/guard-summary.md")
          echo "::error::Causari Guard found $COUNT alert(s)"
          exit 1
        fi
