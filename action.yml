name: 'Causari Guard'
description: 'Privacy-preserving causal watchdog for AI-generated code. Runs re guard and posts findings to PR comments. Zero data leaves your repo.'
author: 'Croviatrust'
branding:
  icon: shield
  color: purple

inputs:
  token:
    description: 'GitHub token for PR comments. Defaults to GITHUB_TOKEN.'
    required: false
    default: ${{ github.token }}
  limit:
    description: 'Number of recent events to scan (default: 20)'
    required: false
    default: '20'
  fail-on-alert:
    description: 'Fail the workflow if any alert is found'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Run Causari Guard
      run: ${{ github.action_path }}/guard.sh
      shell: bash
      env:
        INPUT_TOKEN: ${{ inputs.token }}
        INPUT_LIMIT: ${{ inputs.limit }}
        INPUT_FAIL_ON_ALERT: ${{ inputs.fail-on-alert }}
        GITHUB_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
